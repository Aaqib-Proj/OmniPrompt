version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: promptit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: promptit
      MYSQL_USER: promptit
      MYSQL_PASSWORD: promptit_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - promptit-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: promptit-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://promptit:promptit_secret@mysql:3306/promptit"
      JWT_SECRET: "promptit_prod_secret_jwt_key_2026"
      JWT_REFRESH_SECRET: "promptit_prod_refresh_secret_key_2026"
      NODE_ENV: production
      CORS_ORIGIN: "http://localhost:5173"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - promptit-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: promptit-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - promptit-network

volumes:
  mysql_data:

networks:
  promptit-network:
    driver: bridge
